name: the-cricketer
services:
  postgres:
    # Keep this major version identical in CI, staging and production (see docs/database/overview.md).
    image: postgres:17.9-alpine
    # Development slow-query log (server side). Production tuning is an infrastructure concern.
    command: ['postgres', '-c', 'log_min_duration_statement=250']
    environment:
      POSTGRES_USER: cricketer
      POSTGRES_PASSWORD: cricketer_dev
      POSTGRES_DB: cricketer
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cricketer -d cricketer']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  redis-data:
